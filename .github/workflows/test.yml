name: Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: affiliatekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 11

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Setup Environment Variables
      run: |
        cp apps/core/.env.example apps/core/.env
        cd apps/core && node ace generate:key
        sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/g' .env

    - name: Build Project
      run: pnpm build

    - name: Run Migrations
      run: |
        cd apps/core && node ace migration:run --force

    - name: Run Tests
      run: pnpm test
