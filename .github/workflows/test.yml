name: Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: affiliatekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 11

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Setup Environment Variables
      run: |
        cp apps/core/.env.example apps/core/.env
        APP_KEY=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
        sed -i "s/APP_KEY=/APP_KEY=${APP_KEY}/" apps/core/.env
        sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/g' apps/core/.env

    - name: Build Core
      run: cd apps/core && pnpm build

    - name: Generate Tuyau Registry Placeholder
      run: node scripts/generate-tuyau-placeholder.mjs

    - name: Build Dashboard
      run: cd apps/dashboard && pnpm run build:ci

    - name: Run Migrations
      run: cd apps/core && node ace migration:run --force

    - name: Run Tests
      run: cd apps/core && pnpm test
